name: Build

# Validates that the site builds. Runs on every push to development/main and
# on every PR targeting either — never deploys anything (see deploy.yml for
# that, which only fires on a v* tag pushed to main).

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
